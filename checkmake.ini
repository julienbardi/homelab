# checkmake.ini - Configuration for Makefile linting

[maxbodylength]
# Allow long command strings typical of Docker orchestration and
# complex shell pipes in our automation scripts.
maxBodyLength = 15000
files = mk/*.mk, Makefile

[minphony]
# We ignore phony warnings in the 'mk' directory because those files
# contain internal logic targets, not final build targets.
ignore = true
files = mk/*.mk

[maxvariable]
# Keep the Makefile readable. If a Makefile has more than 50
# variables, it's a sign that it should be broken into smaller files.
maxVariables = 50

[maxrecipe]
# Prevent "Mega-recipes." If a single target has more than 10
# sequential commands, it should be broken into sub-targets for clarity.
maxRecipes = 10
