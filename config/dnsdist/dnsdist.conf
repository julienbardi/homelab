-- dnsdist.conf: DNS frontend for homelab
-- ------------------------------------------------------------
-- Role (CURRENT ARCHITECTURE):
--   - dnsdist is the ONLY DNS listener on the NAS
--   - dnsdist listens on:
--       • 127.0.0.1:53        (local resolver path)
--       • 10.89.12.4:53       (router + LAN clients)
--       • [::1]:53            (local IPv6)
--       • [fd89:7a3b:42c0::4]:53 (ULA IPv6)
--
--   - dnsdist forwards ALL queries to Unbound on:
--       • 127.0.0.1:15335
--       • [fd89:7a3b:42c0::4]:15335
--
--   - dnsmasq is NO LONGER running on the NAS
--     (router-only DNS)
--
--   - Therefore:
--       ✔ dnsdist MUST listen on 10.89.12.4:53 (IPv4 LAN)
--       ✔ dnsdist MUST allow ACL for 10.89.12.0/24
--       ✔ dnsdist MUST allow ACL for 10.0.0.0/8 (WG clients)
--       ✔ dnsdist MUST allow ACL for fd89:7a3b:42c0::/48 (WG IPv6)
--
--   - DoH is served on:
--       • 127.0.0.1:8053
--       • [::1]:8053
--
--   - No recursion, no fallback, no router DNS.
-- ------------------------------------------------------------

local cert = "/etc/dnsdist/certs/fullchain.pem"
local key  = "/etc/dnsdist/certs/privkey.pem"

-- ------------------------------------------------------------
-- DoH listeners (loopback)
-- ------------------------------------------------------------
addDOHLocal("127.0.0.1:8053", cert, key, { "/dns-query" })
addDOHLocal("[::1]:8053",    cert, key, { "/dns-query" })

---- Plain DNS listeners (UDP+TCP port 53, IPv6 only)
--addLocal("127.0.0.1:53",              { tcp = true, udp = true })
--addLocal("10.89.12.4:53",             { tcp = true, udp = true })
addLocal("[::1]:53",                  { tcp = true, udp = true })
addLocal("[fd89:7a3b:42c0::4]:53",    { tcp = true, udp = true })

-- ------------------------------------------------------------
-- Backend: Unbound (loopback only, recursive)
-- ------------------------------------------------------------
--newServer({ address = "[fd89:7a3b:42c0::4]:15335", name = "unbound", checkType = "none" })
newServer({ address = "127.0.0.1:15335", name = "unbound", checkType = "none" })

setServerPolicy(firstAvailable)

-- ------------------------------------------------------------
-- ACL: allow loopback + all WireGuard clients
-- ------------------------------------------------------------
setACL({
  "127.0.0.0/8",
  "::1/128",
  "10.0.0.0/8",
  "10.89.12.0/24",
  "fd89:7a3b:42c0::/48"
})

-- ------------------------------------------------------------
-- Conservative safety defaults
-- ------------------------------------------------------------
setMaxUDPOutstanding(4096)
setMaxTCPClientThreads(100)
