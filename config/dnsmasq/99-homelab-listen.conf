# 99-homelab-listen.conf
#
# dnsmasq = LAN DNS + WireGuard RA/DHCPv6 only
# dnsdist = DNS for WireGuard interfaces (IPv6)
# unbound = local recursive resolver (127.0.0.1#15335)
#

dhcp-leasefile=/dev/null
no-dhcp6

# ------------------------------------------------------------
# LAN DNS (IPv4 only)
# ------------------------------------------------------------
interface=eth0
interface=eth1
interface=br0

listen-address=127.0.0.1,10.89.12.4
port=53

# Upstream resolver
server=127.0.0.1#15335
proxy-dnssec

# Override UGREEN base config: disable inherited resolv-file
resolv-file=

no-resolv
no-poll
neg-ttl=60

# ------------------------------------------------------------
# WireGuard interfaces — DNS disabled, DHCPv6/RA disabled
# ------------------------------------------------------------

interface=wg0
no-dhcp-interface=wg0

interface=wg1
no-dhcp-interface=wg1

interface=wg2
no-dhcp-interface=wg2

interface=wg3
no-dhcp-interface=wg3

interface=wg4
no-dhcp-interface=wg4

interface=wg5
no-dhcp-interface=wg5

interface=wg6
no-dhcp-interface=wg6

interface=wg7
no-dhcp-interface=wg7

interface=wg8
no-dhcp-interface=wg8

interface=wg9
no-dhcp-interface=wg9

interface=wg10
no-dhcp-interface=wg10

interface=wg11
no-dhcp-interface=wg11

interface=wg12
no-dhcp-interface=wg12

interface=wg13
no-dhcp-interface=wg13

interface=wg14
no-dhcp-interface=wg14

interface=wg15
no-dhcp-interface=wg15
