# 99-unbound-forward.conf
# Forward all DNS to Unbound on localhost:15335
# NOTE: dnsmasq only listens on IPv4 (listen-address=0.0.0.0) due to the
# --local-service constraint; see 99-homelab-listen.conf for details.
# IPv6 DNS for Wireguard clients is handled by dnsdist (plain port 53 on
# per-interface ULA), which forward to Unbound. Do NOT re-add server=::1
# as it triggers a UGOS race condition on startup.
server=127.0.0.1#15335
