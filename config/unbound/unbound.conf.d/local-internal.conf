# local-internal.conf
#
# Internal split-horizon DNS for bardi.ch
#
# Contract:
# - Caddy defines which hostnames are internal
# - Unbound defines where those names resolve
# - Public DNS must NEVER contain private IPs
# - local-zone transparent ensures only listed names are overridden
#
# This file is authoritative for internal host resolution.

server:
    local-zone: "bardi.ch." transparent

    # Router (Asus RT-AX86U)
    local-data: "router.bardi.ch. A 10.89.12.1"
    local-data: "router.bardi.ch. AAAA fd89:7a3b:42c0::1"

    # DiskStation (Synology NAS)
    local-data: "diskstation.bardi.ch. A 10.89.12.2"
    local-data: "diskstation.bardi.ch. AAAA fd89:7a3b:42c0::2"

    # QNAP NAS
    local-data: "qnap.bardi.ch. A 10.89.12.3"
    local-data: "qnap.bardi.ch. AAAA fd89:7a3b:42c0::3"

    # Define the canonical hostname for the DXP4800+
    local-data: "nas.bardi.ch. A 10.89.12.4"
    local-data: "nas.bardi.ch. AAAA fd89:7a3b:42c0::4"

    # Now point all services to that canonical host using CNAMEs
    local-data: "dns.bardi.ch. CNAME nas.bardi.ch."
    local-data: "vpn.bardi.ch. CNAME nas.bardi.ch."
    local-data: "derp.bardi.ch. CNAME nas.bardi.ch."
    local-data: "dev.bardi.ch. CNAME nas.bardi.ch."
    local-data: "apt.bardi.ch. CNAME nas.bardi.ch."

    # Local override for Headscale DERP endpoint
    local-data: "derp.vpn.bardi.ch. A 127.0.0.1"
    local-data: "derp.vpn.bardi.ch. AAAA ::1"
