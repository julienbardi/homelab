# local-internal.conf
#
# Internal DNS overrides for bardi.ch
#
# Contract:
# - Only hostnames explicitly listed here are overridden.
# - No parent zone for bardi.ch is defined.
# - All other bardi.ch names resolve via PUBLIC DNS.
# - vpn.bardi.ch MUST resolve publicly for Headscale/Tailscale.
# - derp.vpn.bardi.ch is overridden locally for DERP routing.
#
# This file provides selective internal overrides, not full split-horizon DNS.

server:

    # Router (Asus RT-AX86U)
    local-data: "router.bardi.ch. A 10.89.12.1"
    local-data: "router.bardi.ch. AAAA fd89:7a3b:42c0::1"

    # DiskStation (Synology NAS)
    local-data: "diskstation.bardi.ch. A 10.89.12.2"
    local-data: "diskstation.bardi.ch. AAAA fd89:7a3b:42c0::2"

    # QNAP NAS
    local-data: "qnap.bardi.ch. A 10.89.12.3"
    local-data: "qnap.bardi.ch. AAAA fd89:7a3b:42c0::3"

    # DXP4800+
    local-data: "pve.bardi.ch. A 10.89.12.4"
    local-data: "pve.bardi.ch. AAAA fd89:7a3b:42c0::4"
    local-data: "nas.bardi.ch. A 10.89.12.4"
    local-data: "nas.bardi.ch. AAAA fd89:7a3b:42c0::4"
    local-data: "dns.bardi.ch. A 10.89.12.4"
    local-data: "dns.bardi.ch. AAAA fd89:7a3b:42c0::4"
    local-data: "derp.bardi.ch. A 10.89.12.4"
    local-data: "derp.bardi.ch. AAAA fd89:7a3b:42c0::4"
    local-data: "dev.bardi.ch. A 10.89.12.4"
    local-data: "dev.bardi.ch. AAAA fd89:7a3b:42c0::4"
    local-data: "apt.bardi.ch. A 10.89.12.4"
    local-data: "apt.bardi.ch. AAAA fd89:7a3b:42c0::4"

    # DERP override
    local-data: "derp.vpn.bardi.ch. A 127.0.0.1"
    local-data: "derp.vpn.bardi.ch. AAAA ::1"