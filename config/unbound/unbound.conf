# /etc/unbound/unbound.conf
#
# Purpose:
#   Recursive DNS resolver backend for the homelab.
#   - Listens on localhost for local resolvers (dnsmasq, systemd-resolved)
#   - Listens on LAN IP for the router only
#   - Provides validated, DNSSEC-aware recursion
#
# Deployment procedure:
#   sudo unbound-checkconf ./config/unbound/unbound.conf
#   sudo install -o root -g root -m 0644 ./config/unbound/unbound.conf /etc/unbound/unbound.conf
#   sudo systemctl restart unbound
#
# One-time setup:
#   sudo systemctl enable unbound
#
# Verification:
#   sudo systemctl status unbound
#   sudo journalctl -u unbound -f
#
######################################################################
# Unbound — Homelab Recursive Resolver (IGOS‑Safe, Backend‑Only)
#
# Architectural Role:
#   Unbound is the *backend* recursive DNSSEC resolver for the homelab.
#   It never listens on port 53 and never serves clients directly.
#   All client DNS flows go through:
#
#       dnsdist:53  →  unbound:15335  →  root servers
#       dnsmasq (router) → unbound:15335
#
#   This ensures:
#     • deterministic startup ordering
#     • no port conflicts with dnsdist
#     • clean privilege boundaries
#     • stable recursion under IGOS sandboxing
#
######################################################################
# IGOS Sandbox Constraints (Critical Invariants)
#
#   IGOS enforces several non‑standard restrictions on third‑party daemons:
#
#     1. ❌ UNIX domain sockets are forbidden
#        → Unbound’s remote‑control subsystem must remain disabled.
#
#     2. ❌ Binding to “system‑level” ports is forbidden
#        → IGOS blocks Unbound from binding to 53, 5353, 853, 443, 5335.
#
#     3. ✔ Binding to high ephemeral ports is allowed
#        → Unbound is stable on port 15335 (IGOS‑safe).
#
#     4. ✔ Loopback binding is allowed
#        → interface: 127.0.0.1 and ::1 are safe.
#
#   These constraints are *hard invariants*. Do not change them.
#
######################################################################
# Binding Model (Backend‑Only)
#
#   Unbound listens only on loopback:
#
#       interface: 127.0.0.1
#       interface: ::1
#       port: 15335
#
#   Rationale:
#     • Prevents IGOS wildcard‑bind failures
#     • Avoids conflicts with dnsdist’s IPv4+IPv6 listeners
#     • Ensures Unbound is reachable only by local resolvers
#     • Enforces backend‑only operation
#
######################################################################
# Recursion & DNSSEC
#
#   Unbound performs full DNSSEC‑validating recursion using:
#
#       module-config: "validator iterator"
#
#   Trust anchor:
#       /var/lib/unbound/root.key
#
#   Root hints:
#       /var/lib/unbound/root.hints
#
#   At startup:
#       • trust anchor is primed
#       • DNSKEY is validated
#       • recursion becomes authoritative and secure
#
######################################################################
# Split‑Horizon DNS for bardi.ch
#
#   Strategy:
#     • local-zone: "bardi.ch." transparent
#     • local-data served from unbound.conf.d/*
#     • unknown names inside bardi.ch do NOT recurse externally
#
#   This prevents leakage of internal hostnames to Infomaniak.
#
######################################################################
# Boot‑Time Forwarding (Fallback Only)
#
#   During early boot, the network stack may not be ready for
#   root‑server recursion. Forwarders provide a temporary path:
#
#       Cloudflare, Quad9, Digitale Gesellschaft (CH)
#
#   dns-health disables forwarding after boot, restoring full recursion.
#
######################################################################
# Performance Model
#
#   Optimized for:
#     • DNSSEC validation
#     • high concurrency
#     • large warm cache (dns-warm)
#     • low latency for LAN and router
#
#   Key parameters:
#     • num-threads: 5
#     • msg/rrset/key cache sizes: large
#     • aggressive-nsec: yes
#     • prefetch + prefetch-key: yes
#     • serve-expired: yes
#
######################################################################
# Operational Notes
#
#   • Do NOT re-enable remote-control — IGOS will kill Unbound.
#   • Do NOT change the port — IGOS forbids binding to 5335.
#   • dnsdist and dnsmasq must forward to 127.0.0.1#15335.
#   • verify-internal-dns checks Unbound directly on port 15335.
#
######################################################################

server:
    # Bind only to localhost.
    # Rationale:
    # - dnsdist is the public‑facing resolver on port 53 (IPv4+IPv6).
    # - Unbound is a backend recursive engine and must *not* bind to
    #   wildcard interfaces (0.0.0.0 / ::0), which fail under UGOS
    #   sandboxing and conflict with dnsdist’s IPv6 listeners.
    # - Binding only to loopback guarantees:
    #     • deterministic startup
    #     • no port conflicts with dnsdist
    #     • correct backend‑only operation
    #     • stable behavior across reboots
    interface: 127.0.0.1
    interface: ::1
    interface: 10.89.12.4        # Allow dnsdist (sandboxed) to reach Unbound via LAN IPv4
    interface: fd89:7a3b:42c0::4 # Allow dnsdist (sandboxed) to reach Unbound via ULA IPv6

    # Allow outbound queries via any interface (IPv4 and IPv6)
    outgoing-interface: 0.0.0.0
    outgoing-interface: ::

    # Backend resolver port (dnsmasq forwards here, IGOS forbids binding to 5335 even with correct config and remote-control disabled)
    port: 15335

    # Enable IPv6 support for clients, but prefer IPv4 for upstream recursion
    do-ip6: yes
    prefer-ip6: no

    # Run as unprivileged user
    username: "unbound"
    directory: "/var/lib/unbound"
    pidfile: ""
    do-daemonize: no

    # Enable DNSSEC validation and iterative resolution
    module-config: "validator iterator"

    # AD-bit assertion intentionally disabled.
    # The IGOS/UGREEN Unbound build does not include support for the
    # 'trust-ad:' directive, even though full DNSSEC validation is active.
    # Unbound still performs full validator→iterator DNSSEC recursion and
    # returns RRSIG records, but it cannot mark responses with the AD bit.
    # This is expected and correct for this platform; dns-suite reports
    # DNSSEC health via RRSIG presence instead of AD.

    # Allow querying localhost (required for local resolvers)
    do-not-query-localhost: no

    # DNSSEC trust anchor and root hints
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-permissive-mode: no
    root-hints: "/var/lib/unbound/root.hints"

    # ------------------------------------------------------------
    # Access control
    # ------------------------------------------------------------
    # Access control model:
    # - Unbound is not a client-facing resolver.
    # - Only local resolvers (dnsmasq, systemd-resolved) and the router
    #   are allowed to query Unbound directly.
    # - WireGuard and Tailscale clients never reach Unbound; they send DNS
    #   to the router, which forwards queries on their behalf.
    # - Therefore, no explicit access-control entries are required for
    #   WireGuard or Tailscale address ranges.

    # 1. GLOBAL DEFAULT: Deny everything by default
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse

    # 2. LOCALHOST: Always allow loopback
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow

    # 3. IPv4 SPECIFICITY:
    # Allow the whole LAN so devices can query the NAS directly if needed.
    access-control: 10.89.12.0/24 allow

    # 4. IPv6 SPECIFICITY:
    # We allow the whole ULA prefix /64. This ensures the Router (::1),
    # the NAS (::4), and any Privacy Addresses the NAS might use for
    # health checks are all permitted.
    access-control: fd89:7a3b:42c0::/64 allow

    # ------------------------------------------------------------
    # Performance tuning (Optimized for local DNSSEC recursion)
    # ------------------------------------------------------------
    # Unbound runs with 5 worker threads on the Intel Gold 8505,
    # providing parallel DNSSEC‑validating recursion for LAN and router.
    num-threads: 5

    # Use 8 cache slabs (power of 2) to minimize lock contention
    # across multiple threads.
    msg-cache-slabs: 8
    rrset-cache-slabs: 8
    infra-cache-slabs: 8
    key-cache-slabs: 8

    # Large cache sizes to support the 100k+ dns-warm domain list.
    # These values prevent eviction and keep recursion latency low.
    msg-cache-size: 256m
    rrset-cache-size: 512m
    key-cache-size: 128m
    neg-cache-size: 64m

    # Use DNSSEC NSEC/NSEC3 records aggressively to synthesize
    # NXDOMAIN responses without upstream queries.
    aggressive-nsec: yes

    # Prefetch popular records before expiry to keep cache warm
    # and reduce cold-recursion latency.
    prefetch: yes
    prefetch-key: yes

    # High concurrency for parallel upstream queries.
    # outgoing-range controls the number of simultaneous queries.
    outgoing-range: 8192
    num-queries-per-thread: 16384

    # Serve expired records while refreshing in the background.
    # This avoids latency spikes when upstream is slow.
    serve-expired: yes

    # Socket tuning for high throughput and reduced packet drops.
    so-reuseport: yes
    so-rcvbuf: 8m
    so-sndbuf: 8m

    # Privacy and minimisation features.
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes

    # Moderate verbosity for operational visibility and dns-health metrics.
    verbosity: 2
    extended-statistics: yes

# ------------------------------------------------------------
# Recursive forwarding (boot‑time fallback only)
# ------------------------------------------------------------
# Unbound performs full DNSSEC‑validating recursion once the
# system is fully online. However, during early boot the network
# stack may not yet be ready for root‑server recursion.
#
# These forwarders provide a safe fallback path during boot.
# dns-health and dns-warm will disable forwarding after startup
# to restore full local recursion for optimal performance.
#
forward-zone:
    name: "."

    # Cloudflare (fallback)
    forward-addr: 1.1.1.1
    forward-addr: 1.0.0.1
    forward-addr: 2606:4700:4700::1111
    forward-addr: 2606:4700:4700::1001

    # Quad9 (fallback)
    forward-addr: 9.9.9.9
    forward-addr: 149.112.112.112
    forward-addr: 2620:fe::fe
    forward-addr: 2620:fe::9

    # Digitale Gesellschaft (CH) (fallback)
    forward-addr: 185.95.218.42
    forward-addr: 185.95.218.43

# Remote-control is permanently disabled (IGOS forbids UNIX domain sockets).
# Do NOT add a 'remote-control:' block — Unbound will fail to start.

# Load all additional configuration fragments
include: "/etc/unbound/unbound.conf.d/*.conf"
