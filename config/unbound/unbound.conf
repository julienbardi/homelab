# /etc/unbound/unbound.conf
#
# Purpose:
#   Recursive DNS resolver backend for the homelab.
#   - Listens on localhost and LAN IPs for local resolvers
#   - Provides validated, DNSSEC-aware recursion
#
# Deployment procedure:
#   sudo unbound-checkconf ./config/unbound/unbound.conf
#   sudo install -o root -g root -m 0644 ./config/unbound/unbound.conf /etc/unbound/unbound.conf
#   sudo systemctl restart unbound
#
# One-time setup:
#   sudo systemctl enable unbound
#
# Verification:
#   sudo systemctl status unbound
#   sudo journalctl -u unbound -f
#
######################################################################
# Unbound — Homelab Recursive Resolver (Backend-Only)
#
# Architectural Role:
#   Unbound is the *backend* recursive DNSSEC resolver for the homelab.
#   All client DNS flows go through:
#
#       dnsdist:53  →  unbound:15335  →  root servers
#       dnsmasq (router) → unbound:15335
#
#   This ensures:
#     • deterministic startup ordering
#     • no port conflicts with dnsdist
#     • clean privilege boundaries
#     • stable recursion
#
######################################################################
# Binding Model (Backend-Only)
#
#   Unbound listens on loopback and LAN interfaces:
#
#       interface: 127.0.0.1
#       interface: ::1
#       interface: 10.89.12.4
#       interface: fd89:7a3b:42c0::4
#       port: 15335
#
######################################################################
# Recursion & DNSSEC
#
#   Unbound performs full DNSSEC-validating recursion using:
#
#       module-config: "validator iterator"
#
#   Trust anchor:
#       /var/lib/unbound/root.key
#
#   Root hints:
#       /var/lib/unbound/root.hints
#
######################################################################
# Split-Horizon DNS for bardi.ch
#
#   Strategy:
#     • local-data served from unbound.conf.d/*
#     • selective internal overrides for local services
#
######################################################################
# Performance Model
#
#   Optimized for:
#     • DNSSEC validation
#     • high concurrency
#     • large warm cache
#     • low latency for LAN and router
#
#   Key parameters:
#     • num-threads: 5
#     • msg/rrset/key cache sizes: large
#     • aggressive-nsec: yes
#     • prefetch + prefetch-key: yes
#     • serve-expired: yes
#
######################################################################

server:
    interface: 127.0.0.1
    interface: ::1
    interface: 10.89.12.4
    interface: fd89:7a3b:42c0::4

    outgoing-interface: 0.0.0.0
    outgoing-interface: ::

    port: 15335

    do-ip6: yes
    prefer-ip6: no

    username: "unbound"
    directory: "/var/lib/unbound"
    pidfile: ""
    do-daemonize: no

    module-config: "validator iterator"

    do-not-query-localhost: no

    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-permissive-mode: no
    root-hints: "/var/lib/unbound/root.hints"

    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse

    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    access-control: 10.89.12.0/24 allow
    access-control: fd89:7a3b:42c0::/64 allow

    # ------------------------------------------------------------
    # Performance tuning (Optimized for local DNSSEC recursion)
    # ------------------------------------------------------------
    # Unbound runs with 5 worker threads on the Intel Gold 8505,
    # providing parallel DNSSEC validating recursion for LAN and router.
    num-threads: 5

    # Use 8 cache slabs (power of 2) to minimize lock contention
    # across multiple threads.
    msg-cache-slabs: 8
    rrset-cache-slabs: 8
    infra-cache-slabs: 8
    key-cache-slabs: 8

    # Large cache sizes to support the 100k+ dns-warm domain list.
    # These values prevent eviction and keep recursion latency low.
    msg-cache-size: 256m
    rrset-cache-size: 512m
    key-cache-size: 128m
    neg-cache-size: 64m

    # Use DNSSEC NSEC/NSEC3 records aggressively to synthesize
    # NXDOMAIN responses without upstream queries.
    aggressive-nsec: yes

    # Prefetch popular records before expiry to keep cache warm
    # and reduce cold-recursion latency.
    prefetch: yes
    prefetch-key: yes

    # High concurrency for parallel upstream queries.
    # outgoing-range controls the number of simultaneous queries.
    outgoing-range: 8192
    num-queries-per-thread: 16384

    # Serve expired records while refreshing in the background.
    # This avoids latency spikes when upstream is slow.
    serve-expired: yes

    # Socket tuning for high throughput and reduced packet drops.
    so-reuseport: yes
    so-rcvbuf: 8m
    so-sndbuf: 8m

    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes

    verbosity: 2
    extended-statistics: yes

# ------------------------------------------------------------
# Recursive forwarding (boot time fallback only)
# ------------------------------------------------------------
# Unbound performs full DNSSEC validating recursion once the
# system is fully online. However, during early boot the network
# stack may not yet be ready for root server recursion.
#
# These forwarders provide a safe fallback path during boot.
# dns-health and dns-warm will disable forwarding after startup
# to restore full local recursion for optimal performance.
#
forward-zone:
    name: "."
    forward-first: yes

    # Quad9 (boot fallback)
    forward-addr: 9.9.9.9
    forward-addr: 149.112.112.112
    forward-addr: 2620:fe::fe
    forward-addr: 2620:fe::9

    # Cloudflare (boot fallback)
    forward-addr: 1.1.1.1
    forward-addr: 1.0.0.1
    forward-addr: 2606:4700:4700::1111
    forward-addr: 2606:4700:4700::1001

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953

include: "/etc/unbound/unbound.conf.d/*.conf"