services:
  # UI dashboard (routed via Caddy on internal port 10081)
  dashboard:
    image: netbirdio/dashboard:latest
    container_name: netbird-dashboard
    restart: unless-stopped
    networks:
      - netbird
    ports:
      - '127.0.0.1:10081:80'
    environment:
      - NETBIRD_MGMT_API_ENDPOINT=https://netbird.bardi.ch
      - NETBIRD_MGMT_GRPC_API_ENDPOINT=https://netbird.bardi.ch
      - AUTH_AUDIENCE=netbird-dashboard
      - AUTH_CLIENT_ID=netbird-dashboard
      - AUTH_AUTHORITY=https://netbird.bardi.ch/oauth2
      - AUTH_SUPPORTED_SCOPES=openid profile email
      - USE_AUTH0=false
      - LETSENCRYPT_DOMAIN=none
      - LETSENCRYPT_EMAIL=none
      - NGINX_SSL_PORT=443
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"

  # Combined server (Management + Signal + Relay + STUN)
  netbird-server:
    image: netbirdio/netbird-server:latest
    container_name: netbird-server
    restart: unless-stopped
    networks:
      - netbird
    ports:
      - '3478:3478/udp'
      - '127.0.0.1:10080:80'
    volumes:
      - netbird_data:/var/lib/netbird
      - ./config.yaml:/etc/netbird/config.yaml
    command: ["--config", "/etc/netbird/config.yaml"]
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"

  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.7
    container_name: netbird-crowdsec
    restart: unless-stopped
    networks:
      - netbird
    environment:
      COLLECTIONS: crowdsecurity/linux
    volumes:
      - ./crowdsec:/etc/crowdsec
      - crowdsec_db:/var/lib/crowdsec/data
    healthcheck:
      test: [CMD, cscli, lapi, status]
      interval: 10s
      timeout: 5s
      retries: 15
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"

volumes:
  netbird_data:
  crowdsec_db:

networks:
  netbird:
    name: homelab_netbird
    external: true